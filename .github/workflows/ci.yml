name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python 3.13
    runs-on: windows-latest
    timeout-minutes: 30
    # runner 的控制台代码页不是 UTF-8，测试里大量中文 print 会抛
    # UnicodeEncodeError（cp1252），必须显式把 Python 的 IO 编码钉成 UTF-8。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      # runner 上 ReadDirectoryChangesW 不送事件，watcher 断言在 CI 无意义
      FB_SKIP_WATCHER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q backend main.py tests

      # 统一测试入口（自动发现全部离线可跑的 test_*.py 套件，为每套分配独立 APPDATA 沙盒；
      # 仅需真实 Ollama 模型的 E2E 套件在 run_all.py 内跳过，永不发生 CI 清单漏加漂移）
      - name: Run test suites
        run: python tests/run_all.py
