name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python 3.13
    runs-on: windows-latest
    timeout-minutes: 30
    # runner 的控制台代码页不是 UTF-8，测试里大量中文 print 会抛
    # UnicodeEncodeError（cp1252），必须显式把 Python 的 IO 编码钉成 UTF-8。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      # runner 上 ReadDirectoryChangesW 不送事件，watcher 断言在 CI 无意义
      FB_SKIP_WATCHER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q backend main.py tests

      # 这些套件不依赖 Ollama：规则/索引/FTS/解析/去重/拼音/LLM 打桩。
      # 需要真实模型或真实知识库的套件（test_rag / test_upgrade /
      # test_llm_provider / test_ai_classify / test_winocr）不在此列。
      - name: Run test suites
        shell: pwsh
        run: |
          # 测试脚本以打印 FAIL 计数为准，退出码恒为 0，所以解析输出判断失败。
          $suites = @(
            "test_core", "test_fileindex", "test_batch2", "test_content_index",
            "test_contentver", "test_rel_sort", "test_parse_chunk", "test_maint",
            "test_hybrid", "test_pinyin", "test_llm_robust", "test_kb_followup",
            "test_rerank", "test_update", "test_applog", "test_kb_failed",
            "test_kb_cancel", "test_datadir", "test_hardening",
            "test_session_followups"
          )
          $failed = @()
          # 少数套件按目录名做门禁：test_datadir 要求含 fb_datadir，
          # test_session_followups 要求含 fb_captest，其余含 fb_ 即可。
          $appdataNames = @{
            "test_datadir" = "fb_datadir"
            "test_session_followups" = "fb_captest"
          }
          foreach ($s in $suites) {
            $name = if ($appdataNames.ContainsKey($s)) { $appdataNames[$s] } else { "fb_ci_$s" }
            $env:APPDATA = Join-Path $env:RUNNER_TEMP $name
            New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
            Write-Host "`n=== $s ==="
            $out = & python "tests/$s.py" 2>&1 | Out-String
            Write-Host $out
            if ($out -match "(?m)^\s*FAIL|FAILURES:|Traceback \(most recent call last\)") {
              $failed += $s
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::失败的套件: $($failed -join ', ')"
            exit 1
          }
          Write-Host "所有套件通过"
